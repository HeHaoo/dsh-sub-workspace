name: Release

# Pushing a v* tag (e.g. v0.2.1) publishes the package to npm and creates a
# GitHub Release. Can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create the Release.
permissions:
  contents: write

jobs:
  release:
    name: Publish npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Guard against a tag that drifted from package.json.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag package=$pkg"
          test "$pkg" = "$tag" || { echo "tag $tag does not match package version $pkg"; exit 1; }

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
